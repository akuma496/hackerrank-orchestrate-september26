[project]
name = "buy-or-wait"
version = "0.1.0"
description = "Deterministic multi-agent affordability engine for HackerRank Orchestrate: Buy or Wait?"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.18",
    "ruff>=0.12",
]
agents = [
    "langgraph>=1.0",
]
llm = [
    "anthropic>=0.40",
]

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error"]
xfail_strict = true

# ---------------------------------------------------------------------------
# Static typing: strict everywhere, pydantic-aware
# ---------------------------------------------------------------------------
[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
disallow_any_unimported = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool", "possibly-undefined"]
files = ["buy_or_wait", "quality", "tests"]

[[tool.mypy.overrides]]
module = ["langgraph.*", "langchain_core.*", "anthropic.*"]
follow_untyped_imports = true
disallow_any_unimported = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# Lint
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".cache"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle / pyflakes
    "I",             # import order
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "C4",            # comprehensions
    "RUF",           # ruff-specific
    "ANN",           # annotations everywhere
    "DTZ",           # timezone-aware datetimes only
    "S",             # bandit security checks
    "TID",           # banned APIs (float-prone / nondeterministic modules)
    "PT",            # pytest style
    "N",             # naming
]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"quality/**" = ["S603", "S607"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"math".msg = "Float-based math is banned; use decimal.Decimal via buy_or_wait.schemas.primitives."
"statistics".msg = "statistics works in floats; compute with Decimal in a deterministic tool."
"random".msg = "Nondeterministic; the engine must be reproducible."
"numpy".msg = "Float-based numerics are banned in the engine."
"pandas".msg = "Float-based dataframes are banned in the engine; parse rows into pydantic models."
